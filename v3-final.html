<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:390px;height:844px;font-family:'Nunito',sans-serif;background:#F8F4FF;color:#2D2B3A;overflow:hidden}
  .container{padding:0 12px 12px}

  /* === Module 1: compact === */
  .m1{background:linear-gradient(160deg,#a78bfa 0%,#818cf8 50%,#6dd5fa 100%);border-radius:24px;margin-top:8px;padding:28px 20px 16px;text-align:center;color:#fff;position:relative;overflow:hidden}
  .m1::before{content:'';position:absolute;top:16px;right:16px;width:60px;height:60px;background:rgba(255,255,255,0.1);border-radius:50%}
  .m1 .city{font-size:12px;font-weight:700;opacity:0.8;letter-spacing:2px}
  .m1 .temp{font-size:56px;font-weight:900;line-height:1;margin:4px 0;letter-spacing:-2px}
  .m1 .cond{font-size:14px;font-weight:600;opacity:0.9}
  .m1 .range{font-size:11px;opacity:0.6;margin-top:1px}
  .pills{display:flex;justify-content:center;gap:6px;margin-top:10px}
  .pill{background:rgba(255,255,255,0.2);backdrop-filter:blur(10px);border-radius:16px;padding:5px 12px;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;line-height:1.2}
  .pill .main{display:flex;align-items:center;gap:3px}
  .pill .diff{font-size:9px;opacity:0.75;font-weight:600}
  .pill .diff.up{color:#ffe082}
  .pill .diff.down{color:#b2dfdb}

  /* === Cards === */
  .card{background:#fff;border-radius:20px;padding:12px 12px 10px;margin-top:8px;box-shadow:0 1px 10px rgba(167,139,250,0.06)}
  .card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .card-t{font-size:13px;font-weight:800;color:#2D2B3A}
  .pill-sm{font-size:10px;font-weight:700;color:#a78bfa;background:rgba(167,139,250,0.1);padding:2px 8px;border-radius:10px}
  .note{display:flex;align-items:center;gap:4px;margin-top:6px;font-size:10px;color:#8B8AA0}
  .note strong{color:#a78bfa}

  .day-labels{display:flex;justify-content:space-between;padding:0 2px;margin-top:2px}
  .day-label{font-size:9px;color:#c4b5fd;flex:1;text-align:center;font-weight:700}
  .day-label.today{color:#a78bfa;font-weight:900}
  .legend{display:flex;gap:12px;justify-content:center;margin-top:4px}
  .legend-item{display:flex;align-items:center;gap:3px;font-size:9px;color:#8B8AA0;font-weight:600}
  .legend-dot{width:6px;height:6px;border-radius:50%}
  .legend-dot.hi{background:#e17055}
  .legend-dot.lo{background:#74b9ff}
  .legend-dot.rain{background:linear-gradient(135deg,#6dd5fa,#818cf8)}

  .foot{text-align:center;padding:8px 0;font-size:9px;color:#ddd;letter-spacing:1px}
</style>
</head>
<body>
<div class="container">

  <!-- Module 1 -->
  <div class="m1">
    <div class="city">📍 珠海</div>
    <div class="temp">24°</div>
    <div class="cond">⛈️ 雷暴 · 最高 28° · 最低 24°</div>
    <div class="pills">
      <div class="pill"><div class="main">☔ 100%</div><div class="diff">今日最高</div></div>
      <div class="pill"><div class="main">🌡️ 28°</div><div class="diff">最低24°</div></div>
      <div class="pill"><div class="main">💨 西1级</div><div class="diff">风速5km/h</div></div>
    </div>
  </div>

  <!-- Module 2: 24h rain probability -->
  <div class="card">
    <div class="card-h">
      <div class="card-t">☔ 逐时降雨概率</div>
      <div class="pill-sm">今日</div>
    </div>
    <svg viewBox="0 0 356 110" style="width:100%;height:auto">
      <defs>
        <linearGradient id="pg6" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a78bfa" stop-opacity="0.2"/><stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
        <clipPath id="rc"><rect x="28" y="14" width="324" height="80"/></clipPath>
      </defs>
      <!-- Boundaries: 25% / 50% / 75% -->
      <line x1="28" y1="74" x2="348" y2="74" stroke="#a78bfa" stroke-width="0.5" stroke-dasharray="3,2" opacity="0.35"/>
      <line x1="28" y1="54" x2="348" y2="54" stroke="#818cf8" stroke-width="0.5" stroke-dasharray="3,2" opacity="0.35"/>
      <line x1="28" y1="34" x2="348" y2="34" stroke="#e17055" stroke-width="0.5" stroke-dasharray="3,2" opacity="0.35"/>
      <!-- Y labels -->
      <text x="2" y="86" fill="#a78bfa" font-size="7" font-weight="700" font-family="Nunito">25%</text>
      <text x="2" y="66" fill="#818cf8" font-size="7" font-weight="700" font-family="Nunito">50%</text>
      <text x="2" y="46" fill="#e17055" font-size="7" font-weight="700" font-family="Nunito">75%</text>
      <g clip-path="url(#rc)">
        <path d="M28.0,25.2 41.9,30.8 55.8,34.0 69.7,31.6 83.7,26.8 97.6,23.6 111.5,23.6 125.4,25.2 139.3,26.8 153.2,26.8 167.1,26.8 181.0,25.2 195.0,22.0 208.9,17.2 222.8,14.0 236.7,14.0 250.6,14.0 264.5,14.0 278.4,17.2 292.3,22.8 306.3,28.4 320.2,35.6 334.1,42.8 348.0,46.8 348.0,94.0 28.0,94.0Z" fill="url(#pg6)"/>
        <polyline points="28.0,25.2 41.9,30.8 55.8,34.0 69.7,31.6 83.7,26.8 97.6,23.6 111.5,23.6 125.4,25.2 139.3,26.8 153.2,26.8 167.1,26.8 181.0,25.2 195.0,22.0 208.9,17.2 222.8,14.0 236.7,14.0 250.6,14.0 264.5,14.0 278.4,17.2 292.3,22.8 306.3,28.4 320.2,35.6 334.1,42.8 348.0,46.8"
                  fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="222.8" cy="14.0" r="4" fill="#e17055" stroke="#fff" stroke-width="1.5"/>
        <circle cx="348.0" cy="46.8" r="3" fill="#a78bfa" stroke="#fff" stroke-width="1"/>
      </g>
      <rect x="205.8" y="2" width="34" height="13" rx="6" fill="#e17055"/>
      <text x="222.8" y="11" fill="#fff" font-size="8" font-weight="700" font-family="Nunito" text-anchor="middle">100%</text>
      <!-- X: every 3h -->
      <text x="28.0" y="105" fill="#c4b5fd" font-size="7" font-weight="600" font-family="Nunito" text-anchor="middle">00</text>
      <text x="69.7" y="105" fill="#c4b5fd" font-size="7" font-weight="600" font-family="Nunito" text-anchor="middle">03</text>
      <text x="111.5" y="105" fill="#c4b5fd" font-size="7" font-weight="600" font-family="Nunito" text-anchor="middle">06</text>
      <text x="153.2" y="105" fill="#c4b5fd" font-size="7" font-weight="600" font-family="Nunito" text-anchor="middle">09</text>
      <text x="195.0" y="105" fill="#c4b5fd" font-size="7" font-weight="600" font-family="Nunito" text-anchor="middle">12</text>
      <text x="236.7" y="105" fill="#c4b5fd" font-size="7" font-weight="600" font-family="Nunito" text-anchor="middle">15</text>
      <text x="278.4" y="105" fill="#c4b5fd" font-size="7" font-weight="600" font-family="Nunito" text-anchor="middle">18</text>
      <text x="320.2" y="105" fill="#c4b5fd" font-size="7" font-weight="600" font-family="Nunito" text-anchor="middle">21</text>
    </svg>
    <div class="note">⚡ <strong>14:00 峰值100%</strong>　23:00仅59%</div>
  </div>

  <!-- Module 3: 7-day compact -->
  <div class="card">
    <div class="card-h">
      <div class="card-t">📅 未来七天</div>
    </div>
    <svg viewBox="0 0 350 115" style="width:100%;height:auto">
      <defs>
        <linearGradient id="tm4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#e17055"/><stop offset="100%" stop-color="#fdcb6e"/></linearGradient>
        <linearGradient id="ti4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#74b9ff"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient>
        <linearGradient id="rb4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6dd5fa" stop-opacity="0.4"/><stop offset="100%" stop-color="#6dd5fa" stop-opacity="0.08"/></linearGradient>
        <clipPath id="dc"><rect x="0" y="5" width="350" height="95"/></clipPath>
      </defs>
      <!-- Y range 23°-35°, scale: y=95-((v-23)/12)*86 -->
      <!-- Rain prob bars (max=100, scale to 45px) -->
      <g clip-path="url(#dc)">
        <rect x="14" y="50.0" width="24" height="45.0" rx="3" fill="url(#rb4)"/><rect x="64" y="50.0" width="24" height="45.0" rx="3" fill="url(#rb4)"/><rect x="114" y="50.9" width="24" height="44.1" rx="3" fill="url(#rb4)"/><rect x="164" y="52.2" width="24" height="42.8" rx="3" fill="url(#rb4)"/><rect x="214" y="59.9" width="24" height="35.1" rx="3" fill="url(#rb4)"/><rect x="264" y="69.3" width="24" height="25.7" rx="3" fill="url(#rb4)"/><rect x="314" y="68.9" width="24" height="26.1" rx="3" fill="url(#rb4)"/>
      </g>
      <!-- Grid -->
      <line x1="0" y1="16.2" x2="350" y2="16.2" stroke="#f5f3ff" stroke-width="0.8"/><line x1="0" y1="44.8" x2="350" y2="44.8" stroke="#f5f3ff" stroke-width="0.8"/><line x1="0" y1="66.3" x2="350" y2="66.3" stroke="#f5f3ff" stroke-width="0.8"/><line x1="0" y1="87.8" x2="350" y2="87.8" stroke="#f5f3ff" stroke-width="0.8"/>
      <!-- Max line -->
      <polyline points="27,62.8 77,58.4 127,57.7 177,58.4 227,47.7 277,19.8 327,10.4" fill="none" stroke="url(#tm4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="27" cy="62.8" r="3" fill="#e17055" stroke="#fff" stroke-width="1.2"/><circle cx="77" cy="58.4" r="3" fill="#e17055" stroke="#fff" stroke-width="1.2"/><circle cx="127" cy="57.7" r="3" fill="#e17055" stroke="#fff" stroke-width="1.2"/><circle cx="177" cy="58.4" r="3" fill="#e17055" stroke="#fff" stroke-width="1.2"/><circle cx="227" cy="47.7" r="3" fill="#e17055" stroke="#fff" stroke-width="1.2"/><circle cx="277" cy="19.8" r="3" fill="#e17055" stroke="#fff" stroke-width="1.2"/><circle cx="327" cy="10.4" r="3" fill="#e17055" stroke="#fff" stroke-width="1.2"/>
      <text x="27" y="56.8" fill="#e17055" font-size="8" font-weight="800" font-family="Nunito" text-anchor="middle">28°</text><text x="77" y="52.4" fill="#e17055" font-size="8" font-weight="800" font-family="Nunito" text-anchor="middle">28°</text><text x="127" y="51.7" fill="#e17055" font-size="8" font-weight="800" font-family="Nunito" text-anchor="middle">28°</text><text x="177" y="52.4" fill="#e17055" font-size="8" font-weight="800" font-family="Nunito" text-anchor="middle">28°</text><text x="227" y="41.7" fill="#e17055" font-size="8" font-weight="800" font-family="Nunito" text-anchor="middle">30°</text><text x="277" y="13.8" fill="#e17055" font-size="8" font-weight="800" font-family="Nunito" text-anchor="middle">34°</text><text x="327" y="22.4" fill="#e17055" font-size="8" font-weight="800" font-family="Nunito" text-anchor="middle">35°</text>
      <!-- Min line -->
      <polyline points="27,90.0 77,82.1 127,79.2 177,84.2 227,82.8 277,77.1 327,74.9" fill="none" stroke="url(#ti4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="27" cy="90.0" r="3" fill="#74b9ff" stroke="#fff" stroke-width="1.2"/><circle cx="77" cy="82.1" r="3" fill="#74b9ff" stroke="#fff" stroke-width="1.2"/><circle cx="127" cy="79.2" r="3" fill="#74b9ff" stroke="#fff" stroke-width="1.2"/><circle cx="177" cy="84.2" r="3" fill="#74b9ff" stroke="#fff" stroke-width="1.2"/><circle cx="227" cy="82.8" r="3" fill="#74b9ff" stroke="#fff" stroke-width="1.2"/><circle cx="277" cy="77.1" r="3" fill="#74b9ff" stroke="#fff" stroke-width="1.2"/><circle cx="327" cy="74.9" r="3" fill="#74b9ff" stroke="#fff" stroke-width="1.2"/>
      <text x="27" y="101.0" fill="#74b9ff" font-size="8" font-weight="800" font-family="Nunito" text-anchor="middle">24°</text><text x="77" y="93.1" fill="#74b9ff" font-size="8" font-weight="800" font-family="Nunito" text-anchor="middle">25°</text><text x="127" y="90.2" fill="#74b9ff" font-size="8" font-weight="800" font-family="Nunito" text-anchor="middle">25°</text><text x="177" y="95.2" fill="#74b9ff" font-size="8" font-weight="800" font-family="Nunito" text-anchor="middle">24°</text><text x="227" y="93.8" fill="#74b9ff" font-size="8" font-weight="800" font-family="Nunito" text-anchor="middle">25°</text><text x="277" y="88.1" fill="#74b9ff" font-size="8" font-weight="800" font-family="Nunito" text-anchor="middle">26°</text><text x="327" y="85.9" fill="#74b9ff" font-size="8" font-weight="800" font-family="Nunito" text-anchor="middle">26°</text>
    </svg>
    <div class="day-labels">
      <div class="day-label today">今天</div><div class="day-label">明天</div><div class="day-label">周二</div><div class="day-label">周三</div><div class="day-label">周四</div><div class="day-label">周五</div><div class="day-label">周六</div>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot hi"></div>最高温</div>
      <div class="legend-item"><div class="legend-dot lo"></div>最低温</div>
      <div class="legend-item"><div class="legend-dot rain"></div>降雨概率</div>
    </div>
  </div>

  <div class="foot">珠海天气 · 日出05:58 日落19:06 · 数据更新 2026-08-02</div>
</div>
</body>
</html>
