<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:390px;height:844px;font-family:'Nunito',sans-serif;background:#F8F4FF;color:#2D2B3A;overflow:hidden}
  .container{padding:0 12px 12px}

  /* === Module 1: compact === */
  .m1{background:linear-gradient(160deg,#a78bfa 0%,#818cf8 50%,#6dd5fa 100%);border-radius:24px;margin-top:8px;padding:28px 20px 16px;text-align:center;color:#fff;position:relative;overflow:hidden}
  .m1::before{content:'';position:absolute;top:16px;right:16px;width:60px;height:60px;background:rgba(255,255,255,0.1);border-radius:50%}
  .m1 .city{font-size:12px;font-weight:700;opacity:0.8;letter-spacing:2px}
  .m1 .temp{font-size:56px;font-weight:900;line-height:1;margin:4px 0;letter-spacing:-2px}
  .m1 .cond{font-size:14px;font-weight:600;opacity:0.9}
  .m1 .range{font-size:11px;opacity:0.6;margin-top:1px}
  .pills{display:flex;justify-content:center;gap:6px;margin-top:10px}
  .pill{background:rgba(255,255,255,0.2);backdrop-filter:blur(10px);border-radius:16px;padding:5px 12px;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;line-height:1.2}
  .pill .main{display:flex;align-items:center;gap:3px}
  .pill .diff{font-size:9px;opacity:0.75;font-weight:600}
  .pill .diff.up{color:#ffe082}
  .pill .diff.down{color:#b2dfdb}

  /* === Cards === */
  .card{background:#fff;border-radius:20px;padding:12px 12px 10px;margin-top:8px;box-shadow:0 1px 10px rgba(167,139,250,0.06)}
  .card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .card-t{font-size:13px;font-weight:800;color:#2D2B3A}
  .pill-sm{font-size:10px;font-weight:700;color:#a78bfa;background:rgba(167,139,250,0.1);padding:2px 8px;border-radius:10px}
  .note{display:flex;align-items:center;gap:4px;margin-top:6px;font-size:10px;color:#8B8AA0}
  .note strong{color:#a78bfa}

  .day-labels{display:flex;justify-content:space-between;padding:0 2px;margin-top:2px}
  .day-label{font-size:9px;color:#c4b5fd;flex:1;text-align:center;font-weight:700}
  .day-label.today{color:#a78bfa;font-weight:900}
  .legend{display:flex;gap:12px;justify-content:center;margin-top:4px}
  .legend-item{display:flex;align-items:center;gap:3px;font-size:9px;color:#8B8AA0;font-weight:600}
  .legend-dot{width:6px;height:6px;border-radius:50%}
  .legend-dot.hi{background:#e17055}
  .legend-dot.lo{background:#74b9ff}
  .legend-dot.rain{background:linear-gradient(135deg,#6dd5fa,#818cf8)}

  .foot{text-align:center;padding:8px 0;font-size:9px;color:#ddd;letter-spacing:1px}
</style>
</head>
<body>
<div class="container">

  <!-- Module 1 -->
  <div class="m1">
    <div class="city">📍 珠海</div>
    <div class="temp">28°</div>
    <div class="cond">⛈️ 雷阵雨 · 最高 28° · 最低 25°</div>
    <div class="pills">
      <div class="pill"><div class="main">💧 89%</div><div class="diff up">↑比昨高6%</div></div>
      <div class="pill"><div class="main">🌡️ 31°</div><div class="diff up">↑比昨高2°</div></div>
      <div class="pill"><div class="main">💨 东南3级</div><div class="diff down">↓比昨弱1级</div></div>
    </div>
  </div>

  <!-- Module 2: 24h rainfall compact -->
  <div class="card">
    <div class="card-h">
      <div class="card-t">☔ 逐时降雨</div>
      <div class="pill-sm">今日</div>
    </div>
    <svg viewBox="0 0 356 110" style="width:100%;height:auto">
      <defs>
        <linearGradient id="pg6" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a78bfa" stop-opacity="0.2"/><stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
        <clipPath id="rc"><rect x="28" y="14" width="324" height="80"/></clipPath>
      </defs>
      <!-- Boundaries -->
      <line x1="28" y1="73.7" x2="348" y2="73.7" stroke="#a78bfa" stroke-width="0.5" stroke-dasharray="3,2" opacity="0.35"/>
      <line x1="28" y1="42.4" x2="348" y2="42.4" stroke="#e17055" stroke-width="0.5" stroke-dasharray="3,2" opacity="0.35"/>
      <!-- Y labels -->
      <text x="2" y="86" fill="#a78bfa" font-size="7" font-weight="700" font-family="Nunito">小雨</text>
      <text x="2" y="60" fill="#818cf8" font-size="7" font-weight="700" font-family="Nunito">中雨</text>
      <text x="2" y="30" fill="#e17055" font-size="7" font-weight="700" font-family="Nunito">大雨</text>
      <!-- Clipped chart: y=14 to y=94 (80px), max=5.0, scale: y=94-(val/5)*76 -->
      <g clip-path="url(#rc)">
        <path d="M28,94 L42.1,69.7 L56.2,26 L70.3,57.9 L84.4,61 L98.5,65.7 L112.6,73.7 L126.7,78.1 L140.8,81.2 L154.9,85.9 L169,87.4 L183.1,85.9 L197.2,18 L211.3,28.7 L225.4,66.3 L239.5,75.2 L253.6,79.8 L267.7,85.9 L281.8,89 L295.9,90.5 L310,90.5 L324.1,94 L338.2,85.9 L348,90.5 L348,94 L28,94Z" fill="url(#pg6)"/>
        <polyline points="28,94 42.1,69.7 56.2,26 70.3,57.9 84.4,61 98.5,65.7 112.6,73.7 126.7,78.1 140.8,81.2 154.9,85.9 169,87.4 183.1,85.9 197.2,18 211.3,28.7 225.4,66.3 239.5,75.2 253.6,79.8 267.7,85.9 281.8,89 295.9,90.5 310,90.5 324.1,94 338.2,85.9 348,90.5"
                  fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="197.2" cy="18" r="4" fill="#e17055" stroke="#fff" stroke-width="1.5"/>
        <circle cx="56.2" cy="26" r="3" fill="#a78bfa" stroke="#fff" stroke-width="1"/>
      </g>
      <rect x="180" y="2" width="34" height="13" rx="6" fill="#e17055"/>
      <text x="197.2" y="11" fill="#fff" font-size="8" font-weight="700" font-family="Nunito" text-anchor="middle">5.0mm</text>
      <!-- X: every 3h -->
      <text x="28" y="105" fill="#c4b5fd" font-size="7" font-weight="600" font-family="Nunito" text-anchor="middle">00</text>
      <text x="70.3" y="105" fill="#c4b5fd" font-size="7" font-weight="600" font-family="Nunito" text-anchor="middle">03</text>
      <text x="112.6" y="105" fill="#c4b5fd" font-size="7" font-weight="600" font-family="Nunito" text-anchor="middle">06</text>
      <text x="154.9" y="105" fill="#c4b5fd" font-size="7" font-weight="600" font-family="Nunito" text-anchor="middle">09</text>
      <text x="197.2" y="105" fill="#a78bfa" font-size="7" font-weight="900" font-family="Nunito" text-anchor="middle">12</text>
      <text x="239.5" y="105" fill="#c4b5fd" font-size="7" font-weight="600" font-family="Nunito" text-anchor="middle">15</text>
      <text x="281.8" y="105" fill="#c4b5fd" font-size="7" font-weight="600" font-family="Nunito" text-anchor="middle">18</text>
      <text x="324.1" y="105" fill="#c4b5fd" font-size="7" font-weight="600" font-family="Nunito" text-anchor="middle">21</text>
    </svg>
    <div class="note">⚡ <strong>12:00 峰值5.0mm</strong>　凌晨2点4.5mm</div>
  </div>

  <!-- Module 3: 7-day compact -->
  <div class="card">
    <div class="card-h">
      <div class="card-t">📅 未来七天</div>
    </div>
    <svg viewBox="0 0 350 115" style="width:100%;height:auto">
      <defs>
        <linearGradient id="tm4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#e17055"/><stop offset="100%" stop-color="#fdcb6e"/></linearGradient>
        <linearGradient id="ti4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#74b9ff"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient>
        <linearGradient id="rb4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6dd5fa" stop-opacity="0.4"/><stop offset="100%" stop-color="#6dd5fa" stop-opacity="0.08"/></linearGradient>
        <clipPath id="dc"><rect x="0" y="5" width="350" height="95"/></clipPath>
      </defs>
      <!-- Y range 23°-34°, span=11, chart y=5 to y=95 (90px), scale: y=95-((v-23)/11)*86 -->
      <!-- Rain bars (max=30.8, scale to 45px) -->
      <g clip-path="url(#dc)">
        <rect x="14" y="50" width="24" height="45" rx="3" fill="url(#rb4)"/>
        <rect x="64" y="59" width="24" height="36" rx="3" fill="url(#rb4)"/>
        <rect x="114" y="82" width="24" height="13" rx="3" fill="url(#rb4)"/>
        <rect x="164" y="87" width="24" height="8" rx="3" fill="url(#rb4)"/>
        <rect x="214" y="91" width="24" height="4" rx="3" fill="url(#rb4)"/>
        <rect x="264" y="92" width="24" height="3" rx="3" fill="url(#rb4)"/>
        <rect x="314" y="91" width="24" height="4" rx="3" fill="url(#rb4)"/>
      </g>
      <!-- Grid -->
      <line x1="0" y1="20.7" x2="350" y2="20.7" stroke="#f5f3ff" stroke-width="0.8"/>
      <line x1="0" y1="43.5" x2="350" y2="43.5" stroke="#f5f3ff" stroke-width="0.8"/>
      <line x1="0" y1="66.2" x2="350" y2="66.2" stroke="#f5f3ff" stroke-width="0.8"/>
      <line x1="0" y1="89" x2="350" y2="89" stroke="#f5f3ff" stroke-width="0.8"/>
      <!-- Max line: 28→55.7 29→47.9 30→40.1 31→32.3 32→24.5 32→24.5 32→24.5 -->
      <polyline points="27,55.7 77,47.9 127,40.1 177,32.3 227,24.5 277,24.5 327,24.5" fill="none" stroke="url(#tm4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="27" cy="55.7" r="3" fill="#e17055" stroke="#fff" stroke-width="1.2"/>
      <circle cx="77" cy="47.9" r="3" fill="#e17055" stroke="#fff" stroke-width="1.2"/>
      <circle cx="127" cy="40.1" r="3" fill="#e17055" stroke="#fff" stroke-width="1.2"/>
      <circle cx="177" cy="32.3" r="3" fill="#e17055" stroke="#fff" stroke-width="1.2"/>
      <circle cx="227" cy="24.5" r="3" fill="#e17055" stroke="#fff" stroke-width="1.2"/>
      <circle cx="277" cy="24.5" r="3" fill="#e17055" stroke="#fff" stroke-width="1.2"/>
      <circle cx="327" cy="24.5" r="3" fill="#e17055" stroke="#fff" stroke-width="1.2"/>
      <text x="27" y="50" fill="#e17055" font-size="8" font-weight="800" font-family="Nunito" text-anchor="middle">28°</text>
      <text x="77" y="42" fill="#e17055" font-size="8" font-weight="800" font-family="Nunito" text-anchor="middle">29°</text>
      <text x="127" y="34" fill="#e17055" font-size="8" font-weight="800" font-family="Nunito" text-anchor="middle">30°</text>
      <text x="177" y="26" fill="#e17055" font-size="8" font-weight="800" font-family="Nunito" text-anchor="middle">31°</text>
      <text x="227" y="19" fill="#e17055" font-size="8" font-weight="800" font-family="Nunito" text-anchor="middle">32°</text>
      <text x="277" y="19" fill="#e17055" font-size="8" font-weight="800" font-family="Nunito" text-anchor="middle">32°</text>
      <text x="327" y="19" fill="#e17055" font-size="8" font-weight="800" font-family="Nunito" text-anchor="middle">32°</text>
      <!-- Min line: 25→86.2 25→86.2 26→78.4 27→70.5 28→62.7 28→62.7 28→62.7 -->
      <polyline points="27,86.2 77,86.2 127,78.4 177,70.5 227,62.7 277,62.7 327,62.7" fill="none" stroke="url(#ti4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="27" cy="86.2" r="3" fill="#74b9ff" stroke="#fff" stroke-width="1.2"/>
      <circle cx="77" cy="86.2" r="3" fill="#74b9ff" stroke="#fff" stroke-width="1.2"/>
      <circle cx="127" cy="78.4" r="3" fill="#74b9ff" stroke="#fff" stroke-width="1.2"/>
      <circle cx="177" cy="70.5" r="3" fill="#74b9ff" stroke="#fff" stroke-width="1.2"/>
      <circle cx="227" cy="62.7" r="3" fill="#74b9ff" stroke="#fff" stroke-width="1.2"/>
      <circle cx="277" cy="62.7" r="3" fill="#74b9ff" stroke="#fff" stroke-width="1.2"/>
      <circle cx="327" cy="62.7" r="3" fill="#74b9ff" stroke="#fff" stroke-width="1.2"/>
      <text x="27" y="97" fill="#74b9ff" font-size="8" font-weight="800" font-family="Nunito" text-anchor="middle">25°</text>
      <text x="77" y="97" fill="#74b9ff" font-size="8" font-weight="800" font-family="Nunito" text-anchor="middle">25°</text>
      <text x="127" y="89" fill="#74b9ff" font-size="8" font-weight="800" font-family="Nunito" text-anchor="middle">26°</text>
      <text x="177" y="81" fill="#74b9ff" font-size="8" font-weight="800" font-family="Nunito" text-anchor="middle">27°</text>
      <text x="227" y="73" fill="#74b9ff" font-size="8" font-weight="800" font-family="Nunito" text-anchor="middle">28°</text>
      <text x="277" y="73" fill="#74b9ff" font-size="8" font-weight="800" font-family="Nunito" text-anchor="middle">28°</text>
      <text x="327" y="73" fill="#74b9ff" font-size="8" font-weight="800" font-family="Nunito" text-anchor="middle">28°</text>
    </svg>
    <div class="day-labels">
      <div class="day-label today">今天</div>
      <div class="day-label">明天</div>
      <div class="day-label">周三</div>
      <div class="day-label">周四</div>
      <div class="day-label">周五</div>
      <div class="day-label">周六</div>
      <div class="day-label">周日</div>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot hi"></div>最高温</div>
      <div class="legend-item"><div class="legend-dot lo"></div>最低温</div>
      <div class="legend-item"><div class="legend-dot rain"></div>雨量</div>
    </div>
  </div>

  <div class="foot">珠海天气</div>
</div>
</body>
</html>
